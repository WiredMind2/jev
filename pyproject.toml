[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev"
version = "0.1.0"
description = "Open research v0 of a Jev-like finite-option decision engine. Not TypeSafe Jev and not a claimed RLCD clone."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WiredMind2" }]
keywords = ["decision", "calibration", "research", "system-one"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.3",
  "transformers>=4.44",
  "datasets>=2.20",
  "safetensors>=0.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
jev = "jev.cli:app"

[project.urls]
Homepage = "https://github.com/WiredMind2/jev"
Issues = "https://github.com/WiredMind2/jev/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "cuda: needs NVIDIA GPU, CUDA PyTorch, and enough VRAM",
  "hf: downloads Hugging Face models or datasets",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["jev"]
